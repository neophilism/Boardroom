name: Boardroom maintenance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/maintenance.yml
      - scripts/maintenance.mjs
      - scripts/maintenance-auth.mjs
      - src/server/maintenance-auth.ts
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: read
  id-token: write
jobs:
  maintain:
    if: vars.BOARDROOM_MAINTENANCE_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: boardroom-maintenance
    concurrency:
      group: boardroom-maintenance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/maintenance.mjs
        env:
          BOARDROOM_MAINTENANCE_ENABLED: 'true'
          BOARDROOM_BASE_URL: https://boardroom-iamn.onrender.com
          BOARDROOM_WATCHDOG_TOKEN: ${{ secrets.BOARDROOM_WATCHDOG_TOKEN }}
