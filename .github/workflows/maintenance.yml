name: Boardroom maintenance
on:
  # GitHub cron is best-effort and may run hours late. Every merge to main
  # schedules a bounded recovery tick, regardless of changed file paths.
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: read
  id-token: write
jobs:
  maintain:
    if: github.ref == 'refs/heads/main' && vars.BOARDROOM_MAINTENANCE_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: boardroom-maintenance
    concurrency:
      group: boardroom-maintenance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/maintenance.mjs
        env:
          BOARDROOM_MAINTENANCE_ENABLED: 'true'
          BOARDROOM_BASE_URL: https://boardroom-iamn.onrender.com
