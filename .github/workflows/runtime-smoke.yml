name: Verify live Boardroom deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '21 */12 * * *'
permissions:
  contents: read
jobs:
  http-smoke:
    name: Public HTTPS, readiness, and owner access denial
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed Boardroom web service
        run: node scripts/smoke-deployment.mjs
