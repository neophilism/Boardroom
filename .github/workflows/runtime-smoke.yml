name: Verify live Boardroom deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '21 */12 * * *'
permissions:
  contents: read
concurrency:
  group: boardroom-live-release
  cancel-in-progress: true
jobs:
  http-smoke:
    name: Public HTTPS, readiness, and owner access denial
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed Boardroom web service
        env:
          BOARDROOM_EXPECTED_REVISION: ${{ github.sha }}
        run: node --experimental-strip-types scripts/smoke-deployment.mjs
