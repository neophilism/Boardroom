name: Boardroom security analysis
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  codeql:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          output: codeql-results
      - name: Report actionable CodeQL finding locations
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('codeql-results').glob('*.sarif'):
              for run in json.loads(path.read_text()).get('runs', []):
                  for finding in run.get('results', []):
                      location = finding.get('locations', [{}])[0].get('physicalLocation', {})
                      print(json.dumps({'rule': finding.get('ruleId'), 'file': location.get('artifactLocation', {}).get('uri'), 'line': location.get('region', {}).get('startLine'), 'message': finding.get('message', {}).get('text')}))
          PY
  dependencies:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-fund --no-audit
      - run: npm audit --omit=dev --audit-level=high
